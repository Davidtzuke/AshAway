name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -m unit -v --junitxml=reports/junit-unit.xml
      - name: Integration tests
        run: pytest -m integration -v --junitxml=reports/junit-integration.xml
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: reports/junit-*.xml
