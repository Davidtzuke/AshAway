[project]
name = "ashaway"
version = "0.1.0"
description = "AshAway: wildfire-risk advisor for holiday destinations (SE4CSAI group 9)"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3", "xgboost>=2.0",
    # Task 6: the three servers and the HTTP calls between them
    "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27",
]

[project.scripts]
ashaway = "ashaway.cli:main"
ashaway-ai = "ashaway.services.ai:main"
ashaway-orchestrator = "ashaway.services.orchestrator:main"

[project.optional-dependencies]
geo = ["geopandas>=0.14", "shapely>=2.0"]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ashaway = ["resources/*.json", "resources/*.csv"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "unit: one function, no files or network",
    "integration: several components working together",
]
