[project]
name = "ashaway"
version = "0.1.0"
description = "AshAway: wildfire-risk advisor for holiday destinations (SE4CSAI group 9)"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3", "xgboost>=2.0"]

[project.optional-dependencies]
geo = ["geopandas>=0.14", "shapely>=2.0"]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
